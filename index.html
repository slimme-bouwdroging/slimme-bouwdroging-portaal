<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0B0A">
  <title>Fresh Air One – Klantenportaal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --zwart: #0B0B0A;
      --kaart: #121211;
      --kaart-2: #0E0E0D;
      --lijn: #262624;
      --lijn-zacht: #1D1D1B;
      --tekst: #F4F4F1;
      --zacht: #A3A29D;
      --dim: #75746F;
      --accent: #22D3EE;
      --accent-zacht: rgba(34, 211, 238, 0.10);
      --teal: #5EEAD4;
      --matig: #F5B544;
      --slecht: #F87171;
      --rood: #E5484D;
      --radius: 22px;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { background: var(--zwart); }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(1100px 520px at 25% -8%, rgba(34, 211, 238, 0.12), transparent 62%),
        var(--zwart);
      background-attachment: fixed;
      color: var(--tekst);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ---------- Kopbalk ---------- */
    header {
      background: rgba(11, 11, 10, 0.82);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--lijn-zacht);
      padding: 16px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      position: sticky; top: 0; z-index: 10;
    }
    .merk { display: flex; align-items: baseline; gap: 12px; }
    .merk strong { font-size: 19px; letter-spacing: -0.02em; font-weight: 700; color: var(--tekst); }
    .merk span { font-family: var(--mono); font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.16em; }
    .gebruiker { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--zacht); }
    .gebruiker .rolbadge {
      font-family: var(--mono); border: 1px solid rgba(94, 234, 212, 0.45); background: rgba(94, 234, 212, 0.07);
      border-radius: 999px; padding: 3px 10px; font-size: 10.5px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.14em; color: var(--teal);
    }

    main { max-width: 1080px; margin: 0 auto; padding: 56px 22px 80px; }
    .eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); margin: 0 0 14px; }
    h1 { font-size: clamp(32px, 5vw, 56px); font-weight: 800; letter-spacing: -0.045em; line-height: 1.04; margin: 0 0 14px; }
    h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 4px; }
    h3 { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 14px; }
    .ondertitel { color: var(--zacht); font-size: 17px; margin: 0 0 36px; max-width: 620px; }
    .sectietitel { font-family: var(--mono); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); margin: 44px 0 14px; }

    /* ---------- Kaarten ---------- */
    .kaart {
      background: var(--kaart);
      border: 1px solid var(--lijn);
      border-radius: var(--radius);
      padding: 26px;
      margin: 0 0 20px;
    }
    .kaart-kop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .adres { color: var(--zacht); font-size: 14px; margin: 0; }

    /* ---------- Formulieren ---------- */
    label { display: block; font-size: 13px; font-weight: 600; color: var(--zacht); margin-bottom: 6px; }
    input, textarea, select {
      display: block; width: 100%;
      font: inherit; font-size: 15px;
      padding: 12px 14px; margin: 0 0 16px;
      border: 1px solid var(--lijn); border-radius: 14px;
      background: var(--kaart-2); color: var(--tekst);
    }
    input::placeholder, textarea::placeholder { color: var(--dim); }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-zacht); }
    select option { background: var(--kaart); color: var(--tekst); }
    textarea { min-height: 80px; resize: vertical; }

    button {
      font: inherit; font-size: 14px; font-weight: 600;
      border-radius: 999px; padding: 10px 20px; cursor: pointer;
      border: 1px solid var(--tekst); background: var(--tekst); color: var(--zwart);
      transition: opacity .15s, background .15s;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.45; cursor: default; }
    button.licht { background: transparent; color: var(--tekst); border-color: #3A3A37; }
    button.licht:hover { background: #1A1A19; opacity: 1; }
    header button { padding: 8px 18px; font-size: 13px; }

    .fout { color: var(--slecht); font-size: 14px; }
    .ok { color: var(--accent); font-size: 14px; }
    .verborgen { display: none !important; }

    /* ---------- Login ---------- */
    .login-wrap { min-height: calc(100vh - 66px); display: grid; place-items: center; padding: 24px; }
    .login { width: 100%; max-width: 420px; padding: 34px; }
    .login h1 { font-size: 36px; }
    .login .ondertitel { font-size: 15px; margin-bottom: 26px; }
    .login button { width: 100%; padding: 14px; margin-top: 6px; }

    /* ---------- Live luchtkwaliteit (strook zoals op de Vernast-site) ---------- */
    .tegels {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      background: var(--kaart-2);
      border: 1px solid var(--lijn); border-radius: 18px; overflow: hidden;
    }
    .tegel { background: var(--kaart-2); padding: 18px 18px; box-shadow: 1px 0 0 var(--lijn), 0 1px 0 var(--lijn); }
    .tegel .label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--dim); }
    .tegel .waarde { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; margin-top: 8px; }
    .tegel .eenheid { font-size: 14px; font-weight: 500; color: var(--zacht); margin-left: 4px; letter-spacing: 0; }
    .tegel .status { font-size: 14px; font-weight: 600; margin-top: 4px; }
    .status.goed { color: var(--accent); } .status.matig { color: var(--matig); } .status.slecht { color: var(--slecht); }
    .bijgewerkt { font-size: 13px; color: var(--dim); margin-top: 12px; }

    details { margin-top: 18px; }
    summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--zacht); }
    summary:hover { color: var(--tekst); }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 14px; }
    th { text-align: left; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--dim); font-weight: 600; padding: 10px 8px; border-bottom: 1px solid var(--lijn); }
    td { padding: 12px 8px; border-bottom: 1px solid var(--lijn-zacht); vertical-align: top; color: var(--tekst); }
    .tabel-wrap { overflow-x: auto; }

    /* ---------- Hulp ---------- */
    .hulp { border-top: 1px solid var(--lijn); margin-top: 24px; padding-top: 22px; }
    .hulpknop { background: var(--rood); border-color: var(--rood); color: #fff; }
    .eigen-meldingen h3 { margin-top: 22px; }
    .eigen-meldingen ul { list-style: none; padding: 0; margin: 8px 0 0; }
    .eigen-meldingen li { font-size: 14px; padding: 10px 0; border-bottom: 1px solid var(--lijn-zacht); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

    /* ---------- Badges (stijl "BESCHIKBAAR") ---------- */
    .badge {
      display: inline-block; font-family: var(--mono); border-radius: 999px; padding: 3px 10px;
      font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; white-space: nowrap; border: 1px solid;
    }
    .badge.open { color: var(--slecht); border-color: rgba(248, 113, 113, 0.5); background: rgba(248, 113, 113, 0.08); }
    .badge.behandeling { color: var(--matig); border-color: rgba(245, 181, 68, 0.5); background: rgba(245, 181, 68, 0.08); }
    .badge.opgelost { color: var(--teal); border-color: rgba(94, 234, 212, 0.45); background: rgba(94, 234, 212, 0.07); }

    /* ---------- Beheer ---------- */
    .banner { background: rgba(229, 72, 77, 0.14); border: 1px solid rgba(229, 72, 77, 0.55); color: #FFB4B6; padding: 14px 18px; border-radius: 16px; font-weight: 600; margin-bottom: 16px; }
    .beheer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .beheer-grid .kaart { margin: 0; }
    .rij { display: flex; gap: 8px; }
    .rij input { margin: 0; }
    .rij button { white-space: nowrap; }
    .klantkeuze { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--zacht); }
    .klantkeuze select { width: auto; min-width: 230px; margin: 0; padding: 8px 12px; font-size: 14px; }
    .acties button { padding: 6px 14px; font-size: 13px; margin: 0 6px 6px 0; }
    tr.open-rij td { background: rgba(248, 113, 113, 0.05); }


    /* ---------- Toestellen (per kamer) ---------- */
    .toestel { border-top: 1px solid var(--lijn); padding-top: 22px; margin-top: 22px; }
    .toestel:first-of-type { border-top: none; padding-top: 0; margin-top: 4px; }
    .toestel-kop { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .toestel-kop h3 { margin: 0; font-size: 19px; }
    .toestel-kop .serie { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: 0.08em; margin-left: 8px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { font-family: var(--mono); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; border-radius: 999px; padding: 3px 10px; border: 1px solid #3A3A37; color: var(--zacht); }
    .chip.online { color: var(--teal); border-color: rgba(94, 234, 212, 0.45); background: rgba(94, 234, 212, 0.07); }
    .chip.offline { color: var(--slecht); border-color: rgba(248, 113, 113, 0.5); background: rgba(248, 113, 113, 0.08); }
    .chip.uit { color: var(--dim); }
    .alarm { font-size: 14px; border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; border: 1px solid; }
    .alarm.waarschuwing, .alarm.info { color: var(--matig); border-color: rgba(245, 181, 68, 0.4); background: rgba(245, 181, 68, 0.06); }
    .alarm.kritiek { color: var(--slecht); border-color: rgba(248, 113, 113, 0.45); background: rgba(248, 113, 113, 0.07); }
    .voetnoot { font-size: 12px; color: var(--dim); margin: 8px 0 0; }

    /* ---------- Grafieken ---------- */
    .grafiek { margin-top: 18px; background: var(--kaart-2); border: 1px solid var(--lijn); border-radius: 18px; padding: 16px 16px 10px; }
    .grafiek-balk { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .tabs button { background: transparent; color: var(--zacht); border: 1px solid transparent; padding: 6px 12px; font-size: 13px; }
    .tabs button:hover { color: var(--tekst); background: #1A1A19; opacity: 1; }
    .tabs button.actief { color: var(--zwart); background: var(--tekst); border-color: var(--tekst); }
    .tabs.periode button { font-family: var(--mono); font-size: 12px; }
    .grafiek-vak { position: relative; }
    .grafiek svg { width: 100%; height: auto; display: block; }
    .grafiek .as { font-family: var(--mono); font-size: 10px; fill: var(--dim); }
    .grafiek .drempel-label { font-family: var(--mono); font-size: 10px; }
    .tip { position: absolute; pointer-events: none; background: #1C1C1B; border: 1px solid var(--lijn); border-radius: 10px; padding: 6px 10px; font-size: 13px; white-space: nowrap; transform: translate(-50%, -110%); }
    .tip small { display: block; color: var(--dim); font-family: var(--mono); font-size: 10.5px; }
    .grafiek-leeg { color: var(--dim); font-size: 14px; padding: 40px 0; text-align: center; }


    /* ---------- Bediening ---------- */
    .bediening { background: var(--kaart-2); border: 1px solid var(--lijn); border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; }
    .bed-rij { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 0; }
    .bed-rij + .bed-rij { border-top: 1px solid var(--lijn-zacht); }
    .bed-label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--dim); min-width: 70px; }
    .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; border: 1px solid var(--lijn); border-radius: 22px; padding: 3px; background: var(--kaart); }
    .seg button { background: transparent; border: none; color: var(--zacht); padding: 7px 14px; font-size: 13px; }
    .seg button:hover:not(:disabled) { color: var(--tekst); background: #1F1F1D; opacity: 1; }
    .seg button.actief { background: var(--tekst); color: var(--zwart); }
    .seg button.actief.boost { background: var(--accent); }
    .seg.stand button { min-width: 38px; padding: 7px 0; font-family: var(--mono); }
    .bed-rij select { width: auto; margin: 0; padding: 7px 12px; font-size: 13px; border-radius: 999px; }
    .bed-rij > button { padding: 8px 16px; font-size: 13px; }
    .bed-info { font-size: 13px; color: var(--accent); }
    .bed-melding { font-size: 13px; margin: 8px 0 0; min-height: 1em; color: var(--zacht); }
    .bed-melding.ok { color: var(--accent); } .bed-melding.fout { color: var(--slecht); }
    .bed-offline { font-size: 13px; color: var(--slecht); margin: 0 0 6px; }
    .log { margin-top: 6px; }
    .log ul { list-style: none; padding: 0; margin: 8px 0 0; }
    .log li { font-size: 13px; color: var(--zacht); padding: 6px 0; border-bottom: 1px solid var(--lijn-zacht); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }


    /* ---------- Filter & onderhoud ---------- */
    .onderhoud { margin-top: 18px; background: var(--kaart-2); border: 1px solid var(--lijn); border-radius: 18px; padding: 16px 18px; }
    .onderhoud-kop { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .onderhoud h4 { margin: 0; font-size: 15px; font-weight: 700; }
    .meter { height: 8px; background: #1F1F1D; border-radius: 999px; overflow: hidden; margin: 12px 0 6px; }
    .meter > div { height: 100%; border-radius: 999px; }
    .meter .goed { background: var(--accent); } .meter .matig { background: var(--matig); } .meter .slecht { background: var(--slecht); }
    .onderhoud .regel { font-size: 14px; color: var(--zacht); margin: 4px 0; }
    .onderhoud .regel strong { color: var(--tekst); }
    .onderhoud .regel.matig strong { color: var(--matig); }
    .onderhoud-acties { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .onderhoud-acties button { padding: 8px 16px; font-size: 13px; }
    button.bevestig { background: var(--accent); border-color: var(--accent); color: var(--zwart); }
    .onderhoud-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    .onderhoud-form select, .onderhoud-form input { width: auto; margin: 0; padding: 8px 12px; font-size: 13px; }
    .onderhoud-form input { flex: 1; min-width: 200px; }

    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      .merk span { display: none; }
      .gebruiker #naam { display: none; }
      main { padding: 32px 14px 56px; }
      .kaart { padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="merk"><strong>Fresh Air One</strong><span>Klantenportaal</span></div>
    <div id="gebruikerBalk" class="gebruiker verborgen">
      <span id="naam"></span>
      <span id="rol" class="rolbadge"></span>
      <button id="uitlogKnop">Uitloggen</button>
    </div>
  </header>

  <!-- Inloggen -->
  <div id="loginBlok" class="login-wrap">
    <div class="kaart login">
      <p class="eyebrow">Vernast-app</p>
      <h1>Welkom terug.</h1>
      <p class="ondertitel">Log in om de lucht in uw woning op te volgen.</p>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username">
      <label for="wachtwoord">Wachtwoord</label>
      <input id="wachtwoord" type="password" autocomplete="current-password">
      <button id="loginKnop">Inloggen</button>
      <p id="loginFout" class="fout"></p>
    </div>
  </div>

  <!-- Na inloggen -->
  <main id="appBlok" class="verborgen">
    <p class="eyebrow">Vernast-app</p>
    <h1 id="begroeting"></h1>
    <p id="ondertitel" class="ondertitel"></p>

    <!-- Alleen voor beheerder (Vernast) -->
    <section id="meldingenBlok" class="verborgen">
      <div id="nieuwBanner" class="banner verborgen">🔔 Nieuwe melding binnengekomen</div>
      <div class="kaart">
        <div class="kaart-kop">
          <h2>Meldingen</h2>
          <span class="badge open"><span id="aantalOpen">0</span> open</span>
        </div>
        <p id="meldingenFout" class="fout"></p>
        <div id="meldingenLijst" class="tabel-wrap"></div>
      </div>
    </section>

    <section id="beheerBlok" class="verborgen">
      <p class="sectietitel">Beheer</p>
      <div class="beheer-grid">
        <div class="kaart">
          <h3>Klant toevoegen</h3>
          <label for="nkNaam">Naam</label>
          <input id="nkNaam" type="text">
          <label for="nkEmail">E-mail</label>
          <input id="nkEmail" type="email">
          <label for="nkWachtwoord">Tijdelijk wachtwoord (min. 8 tekens)</label>
          <div class="rij">
            <input id="nkWachtwoord" type="text" autocomplete="off">
            <button id="nkGenereer" type="button" class="licht">Genereer</button>
          </div>
          <p></p>
          <button id="nkKnop">Klant aanmaken</button>
          <p id="nkStatus"></p>
        </div>
        <div class="kaart">
          <h3>Woning toevoegen</h3>
          <label for="nwNaam">Naam</label>
          <input id="nwNaam" type="text" placeholder="Woning 004">
          <label for="nwAdres">Adres</label>
          <input id="nwAdres" type="text">
          <label for="nwKlant">Klant</label>
          <select id="nwKlant"></select>
          <button id="nwKnop">Woning aanmaken</button>
          <p id="nwStatus"></p>
        </div>
      </div>
      <div class="kaart" style="margin-top:20px">
        <h3>Filters bijna op</h3>
        <div id="filterLijst" class="tabel-wrap"></div>
      </div>
      <div class="kaart">
        <h3>Klanten</h3>
        <div id="klantenLijst" class="tabel-wrap"></div>
      </div>
    </section>

    <p class="sectietitel" id="woningenTitel">Woningen</p>
    <div id="woningen"></div>
  </main>

  <script>
    // ================== INSTELLINGEN ==================
    // Alleen de PUBLIEKE sleutel hier. Nooit de secret/service_role key!
    const SUPABASE_URL = 'https://tmkolufszuzbariaupsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_HZgBbFIujygWgu7LCe7PSg_MPnblGz2';
    // Naam (slug) van de Edge Function, exact zoals in Supabase:
    const FUNCTIE_KLANT_AANMAKEN = 'klant-aanmakennder';
    // ==================================================

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let rol = null;
    let kanaal = null;
    let klanten = [];
    let statusKanaal = null;
    let boostTimer = null;
    const luisteraars = {};   // toestel_id -> lijst functies die bij statuswijziging opnieuw tekenen
    let gebruikerId = null;
    function luister(toestelId, fn) { (luisteraars[toestelId] = luisteraars[toestelId] || []).push(fn); }

    const $ = (id) => document.getElementById(id);
    const datum = (t) => new Date(t).toLocaleString('nl-BE', { dateStyle: 'short', timeStyle: 'short' });

    function maak(tag, tekst, klasse) {
      const el = document.createElement(tag);
      if (tekst !== undefined && tekst !== null) el.textContent = tekst;
      if (klasse) el.className = klasse;
      return el;
    }

    function statusBadge(status) {
      const klasse = status === 'open' ? 'open' : status === 'opgelost' ? 'opgelost' : 'behandeling';
      return maak('span', status, 'badge ' + klasse);
    }

    // ---------- Inloggen / uitloggen ----------
    async function inloggen() {
      $('loginFout').textContent = '';
      $('loginKnop').disabled = true;
      const { error } = await db.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('wachtwoord').value
      });
      $('loginKnop').disabled = false;
      if (error) { $('loginFout').textContent = 'Inloggen mislukt: ' + error.message; return; }
      await toonApp();
    }

    async function uitloggen() {
      if (kanaal) { await db.removeChannel(kanaal); kanaal = null; }
      if (statusKanaal) { await db.removeChannel(statusKanaal); statusKanaal = null; }
      if (boostTimer) { clearInterval(boostTimer); boostTimer = null; }
      for (const k of Object.keys(luisteraars)) delete luisteraars[k];
      await db.auth.signOut();
      rol = null;
      $('appBlok').classList.add('verborgen');
      $('gebruikerBalk').classList.add('verborgen');
      $('meldingenBlok').classList.add('verborgen');
      $('beheerBlok').classList.add('verborgen');
      $('loginBlok').classList.remove('verborgen');
    }

    // ---------- Hoofdscherm ----------
    async function toonApp() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) return;
      gebruikerId = user.id;
      for (const k of Object.keys(luisteraars)) delete luisteraars[k];

      const { data: profiel } = await db.from('profielen')
        .select('naam, rol').eq('id', user.id).single();
      rol = profiel?.rol || 'onbekend';
      const naam = profiel?.naam || user.email;
      $('naam').textContent = naam;
      $('rol').textContent = rol;

      if (rol === 'beheerder') {
        $('begroeting').textContent = 'Overzicht';
        $('ondertitel').textContent = 'Alle klanten, woningen en meldingen op één plek.';
        $('meldingenBlok').classList.remove('verborgen');
        $('beheerBlok').classList.remove('verborgen');
        $('woningenTitel').textContent = 'Alle woningen';
        await laadMeldingen();
        await laadKlanten();
        await laadFilterLijst();
        startRealtime();
      } else {
        $('begroeting').textContent = 'Hallo ' + naam.split(' ')[0] + '.';
        $('ondertitel').textContent = 'Zo staat het met de lucht in uw woning.';
        $('meldingenBlok').classList.add('verborgen');
        $('beheerBlok').classList.add('verborgen');
        $('woningenTitel').textContent = 'Uw woning';
      }

      // Verlopen boosts afronden (een echt toestel doet dit zelf; nu de simulator)
      await db.rpc('boost_afronden');
      if (!boostTimer) boostTimer = setInterval(() => db.rpc('boost_afronden'), 60000);
      startStatusRealtime();

      await toonWoningen();

      $('loginBlok').classList.add('verborgen');
      $('gebruikerBalk').classList.remove('verborgen');
      $('appBlok').classList.remove('verborgen');
    }

    async function toonWoningen() {
      const lijst = $('woningen');
      lijst.innerHTML = '';

      const { data: woningen, error } = await db.from('woningen')
        .select('id, naam, adres, klant_id').order('naam');
      if (error) { lijst.appendChild(maak('p', 'Fout: ' + error.message, 'fout')); return; }
      if (woningen.length === 0) { lijst.appendChild(maak('p', 'Geen woningen gevonden.', 'ondertitel')); return; }

      for (const w of woningen) {
        const kaart = maak('div', null, 'kaart');
        const kop = maak('div', null, 'kaart-kop');
        const titel = maak('div');
        titel.appendChild(maak('h2', w.naam));
        titel.appendChild(maak('p', w.adres || '', 'adres'));
        kop.appendChild(titel);
        if (rol === 'beheerder') kop.appendChild(klantKeuzeVoorWoning(w));
        kaart.appendChild(kop);

        const { data: toestellen } = await db.from('toestellen')
          .select('id, naam, model, serienummer, toestel_status(*)')
          .eq('woning_id', w.id)
          .order('naam');

        if (!toestellen || toestellen.length === 0) {
          kaart.appendChild(maak('p', 'Nog geen toestellen geïnstalleerd.', 'adres'));
        } else {
          for (const t of toestellen) kaart.appendChild(await toestelBlok(t, w));
        }

        if (rol === 'klant') kaart.appendChild(hulpBlok(w));
        lijst.appendChild(kaart);
      }
    }

    // ---------- Meetwaarden: instellingen ----------
    const MEETWAARDEN = {
      temperatuur: { label: 'Temperatuur', eenheid: '°C', dec: 1, drempels: [] },
      vochtigheid: { label: 'Vochtigheid', eenheid: '%', dec: 0, drempels: [{ w: 60, k: 'matig' }, { w: 70, k: 'slecht' }] },
      co2:         { label: 'CO₂', eenheid: 'ppm', dec: 0, drempels: [{ w: 800, k: 'matig' }, { w: 1200, k: 'slecht' }] },
      tvoc:        { label: 'TVOC', eenheid: 'mg/m³', dec: 2, drempels: [{ w: 0.3, k: 'matig' }], extra: true },
      pm25:        { label: 'Fijnstof', eenheid: 'µg/m³', dec: 0, drempels: [{ w: 15, k: 'matig' }, { w: 35, k: 'slecht' }], extra: true }
    };
    const KLEUR = { goed: '#22D3EE', matig: '#F5B544', slecht: '#F87171' };
    const MODUS_TEKST = { automatisch: 'Automatisch', handmatig: 'Handmatig', sleep: 'Sleep Air', boost: 'Boost', afwezig: 'Afwezig' };

    // Indicatieve grenzen voor de kleurcode (geen norm)
    function beoordeel(soort, waarde) {
      if (waarde === null || waarde === undefined) return null;
      const v = Number(waarde);
      if (soort === 'co2') return v < 800 ? ['goed', 'Frisse lucht'] : v < 1200 ? ['matig', 'Ventileren aangeraden'] : ['slecht', 'Muffe lucht'];
      if (soort === 'vochtigheid') return v < 40 ? ['matig', 'Droog'] : v <= 60 ? ['goed', 'Comfortabel'] : v <= 70 ? ['matig', 'Vrij vochtig'] : ['slecht', 'Te vochtig'];
      if (soort === 'temperatuur') return v < 16 ? ['matig', 'Koel'] : v <= 24 ? ['goed', 'Aangenaam'] : ['matig', 'Warm'];
      if (soort === 'tvoc') return v < 0.3 ? ['goed', 'Laag'] : v < 1 ? ['matig', 'Verhoogd'] : ['slecht', 'Hoog'];
      if (soort === 'pm25') return v < 15 ? ['goed', 'Zuiver'] : v < 35 ? ['matig', 'Matig'] : ['slecht', 'Slecht'];
      return null;
    }

    function getal(v, dec) {
      if (v === null || v === undefined) return '–';
      return Number(v).toLocaleString('nl-BE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    function sindsTekst(t) {
      const min = Math.round((Date.now() - new Date(t).getTime()) / 60000);
      if (min < 2) return 'net nog';
      if (min < 60) return min + ' min geleden';
      const u = Math.round(min / 60);
      if (u < 48) return u + ' uur geleden';
      return Math.round(u / 24) + ' dagen geleden';
    }

    // ---------- Eén toestel (kamer) ----------
    async function toestelBlok(t, w) {
      const st = Array.isArray(t.toestel_status) ? t.toestel_status[0] : t.toestel_status;
      const blok = maak('div', null, 'toestel');

      // Kop: kamer + status-chips
      const kop = maak('div', null, 'toestel-kop');
      const naam = maak('h3', t.naam);
      if (rol === 'beheerder' && t.serienummer) naam.appendChild(maak('span', t.serienummer, 'serie'));
      kop.appendChild(naam);
      const chips = maak('div', null, 'chips');
      if (st) vulChips(chips, st);
      kop.appendChild(chips);
      blok.appendChild(kop);

      if (st) blok.appendChild(bedieningBlok(t, st, chips));

      // Open alarmen
      const { data: alarmen } = await db.from('alarmen')
        .select('soort, ernst, bericht, aangemaakt_op')
        .eq('toestel_id', t.id).is('opgelost_op', null)
        .order('aangemaakt_op', { ascending: false });
      for (const a of (alarmen || [])) {
        blok.appendChild(maak('div', '⚠ ' + (a.bericht || a.soort) + ' · ' + sindsTekst(a.aangemaakt_op), 'alarm ' + a.ernst));
      }

      // Laatste meting
      const { data: laatste } = await db.from('metingen')
        .select('gemeten_op, temperatuur, vochtigheid, co2, tvoc, pm25')
        .eq('toestel_id', t.id)
        .order('gemeten_op', { ascending: false })
        .limit(1);
      const m = laatste && laatste[0];

      if (!m) {
        blok.appendChild(maak('p', 'Nog geen metingen ontvangen.', 'adres'));
        return blok;
      }

      const tegels = maak('div', null, 'tegels');
      for (const sleutel of ['co2', 'tvoc', 'pm25', 'temperatuur', 'vochtigheid']) {
        const cfg = MEETWAARDEN[sleutel];
        tegels.appendChild(tegel(cfg.label + (cfg.extra ? ' *' : ''), getal(m[sleutel], cfg.dec), cfg.eenheid, beoordeel(sleutel, m[sleutel])));
      }
      let filterTegel = null;
      if (st) {
        filterTegel = tegel('Filter', st.filter_procent, '%', filterOordeel(st.filter_procent));
        tegels.appendChild(filterTegel);
        luister(t.id, (nieuw) => {
          if (nieuw.filter_procent === undefined || !filterTegel) return;
          const n = tegel('Filter', nieuw.filter_procent, '%', filterOordeel(nieuw.filter_procent));
          filterTegel.replaceWith(n); filterTegel = n;
        });
      }
      blok.appendChild(tegels);
      blok.appendChild(maak('p', 'Laatst gemeten: ' + datum(m.gemeten_op) + ' · * TVOC en fijnstof vragen een extra sensor (testdata)', 'voetnoot'));

      blok.appendChild(grafiekBlok(t.id));
      if (st) blok.appendChild(onderhoudBlok(t, st, w));
      return blok;
    }

    // ---------- Filter: inschatting (uitgaande van ± 26 weken per filter) ----------
    function filterOordeel(pct) {
      const weken = Math.round(pct * 26 / 100);
      if (pct <= 15) return ['slecht', 'Vervangen aangeraden'];
      if (pct <= 35) return ['matig', 'Nog ± ' + weken + ' weken'];
      return ['goed', 'Nog ± ' + weken + ' weken'];
    }

    const ONDERHOUD_TEKST = { installatie: 'Installatie', filter_vervangen: 'Filter vervangen', onderhoud: 'Onderhoud', interventie: 'Interventie' };

    // ---------- Filter & onderhoud van één toestel ----------
    function onderhoudBlok(t, st, w) {
      const blok = maak('div', null, 'onderhoud');
      const kop = maak('div', null, 'onderhoud-kop');
      kop.appendChild(maak('h4', 'Filter & onderhoud'));
      blok.appendChild(kop);

      const meter = maak('div', null, 'meter');
      const balk = maak('div');
      meter.appendChild(balk);
      const filterRegel = maak('p', null, 'regel');
      const onderhoudRegel = maak('p', null, 'regel');
      const melding = maak('p', null, 'bed-melding');
      const acties = maak('div', null, 'onderhoud-acties');
      const historiek = maak('details', null, 'log');
      const histLijst = maak('div');
      historiek.appendChild(maak('summary', 'Onderhoudshistoriek'));
      historiek.appendChild(histLijst);
      blok.append(meter, filterRegel, onderhoudRegel, acties);

      let pct = st.filter_procent;
      let online = st.online;

      function tekenFilter() {
        const o = filterOordeel(pct);
        balk.className = o[0];
        balk.style.width = Math.max(2, pct) + '%';
        filterRegel.innerHTML = '';
        filterRegel.appendChild(document.createTextNode('Filter: '));
        filterRegel.appendChild(maak('strong', pct + ' %'));
        filterRegel.appendChild(document.createTextNode(' · ' + o[1]));
        filterKnop.disabled = !online;
      }

      // Filter vervangen: twee keer klikken (geen pop-up)
      const filterKnop = maak('button', 'Filter vervangen ✓', 'licht');
      let bevestigTimer = null;
      filterKnop.addEventListener('click', async () => {
        if (!filterKnop.classList.contains('bevestig')) {
          filterKnop.classList.add('bevestig');
          filterKnop.textContent = 'Klik opnieuw om te bevestigen';
          bevestigTimer = setTimeout(() => { filterKnop.classList.remove('bevestig'); filterKnop.textContent = 'Filter vervangen ✓'; }, 5000);
          return;
        }
        clearTimeout(bevestigTimer);
        filterKnop.classList.remove('bevestig');
        filterKnop.textContent = 'Filter vervangen ✓';
        filterKnop.disabled = true;
        melding.textContent = 'Bezig...'; melding.className = 'bed-melding';
        const { data, error } = await db.from('commandos')
          .insert({ toestel_id: t.id, actie: 'filter_reset' })
          .select('status, foutmelding').single();
        if (error) { melding.textContent = 'Niet gelukt: ' + error.message; melding.className = 'bed-melding fout'; }
        else if (data.status === 'mislukt') { melding.textContent = 'Niet uitgevoerd: ' + (data.foutmelding || ''); melding.className = 'bed-melding fout'; }
        else { melding.textContent = 'Filterteller staat terug op 100 % ✓'; melding.className = 'bed-melding ok'; }
        const { data: nieuw } = await db.from('toestel_status').select('filter_procent, online').eq('toestel_id', t.id).single();
        if (nieuw) { pct = nieuw.filter_procent; online = nieuw.online; }
        tekenFilter();
        for (const fn of (luisteraars[t.id] || [])) fn({ filter_procent: pct });
        await laadHistoriek();
        if (rol === 'beheerder') laadFilterLijst();
      });
      acties.appendChild(filterKnop);

      // Klant: onderhoudsafspraak aanvragen (komt als melding binnen bij Vernast)
      if (rol === 'klant') {
        const afspraak = maak('button', 'Onderhoudsafspraak aanvragen', 'licht');
        afspraak.addEventListener('click', async () => {
          afspraak.disabled = true;
          const { error } = await db.from('meldingen').insert({
            woning_id: w.id,
            bericht: 'Onderhoudsafspraak aangevraagd voor ' + t.naam + (t.serienummer ? ' (' + t.serienummer + ')' : '')
          });
          if (error) { melding.textContent = 'Niet gelukt: ' + error.message; melding.className = 'bed-melding fout'; afspraak.disabled = false; }
          else { melding.textContent = 'Aanvraag verstuurd. Vernast neemt contact op om een moment te plannen.'; melding.className = 'bed-melding ok'; }
        });
        acties.appendChild(afspraak);
      }

      blok.appendChild(melding);

      // Beheerder: onderhoud of interventie registreren
      if (rol === 'beheerder') {
        const form = maak('div', null, 'onderhoud-form');
        const soort = maak('select');
        for (const [k, v] of [['onderhoud', 'Onderhoud'], ['interventie', 'Interventie']]) { const o = maak('option', v); o.value = k; soort.appendChild(o); }
        const omschr = maak('input'); omschr.placeholder = 'Omschrijving (bv. ventilator gereinigd)';
        const knop = maak('button', 'Registreren');
        knop.addEventListener('click', async () => {
          if (!omschr.value.trim()) { melding.textContent = 'Vul een omschrijving in.'; melding.className = 'bed-melding fout'; return; }
          knop.disabled = true;
          const { error } = await db.from('onderhoud').insert({ toestel_id: t.id, soort: soort.value, omschrijving: omschr.value.trim(), door: gebruikerId });
          if (error) { melding.textContent = 'Niet gelukt: ' + error.message; melding.className = 'bed-melding fout'; }
          else { melding.textContent = 'Geregistreerd ✓'; melding.className = 'bed-melding ok'; omschr.value = ''; await laadHistoriek(); historiek.open = true; }
          knop.disabled = false;
        });
        form.append(soort, omschr, knop);
        blok.appendChild(form);
      }

      blok.appendChild(historiek);

      async function laadHistoriek() {
        const { data } = await db.from('onderhoud')
          .select('soort, omschrijving, uitgevoerd_op')
          .eq('toestel_id', t.id)
          .order('uitgevoerd_op', { ascending: false });
        const lijst = data || [];

        // Volgend onderhoud: 1 jaar na laatste installatie of onderhoud
        const basis = lijst.find(o => o.soort === 'onderhoud' || o.soort === 'installatie');
        onderhoudRegel.innerHTML = '';
        onderhoudRegel.className = 'regel';
        if (basis) {
          const volgend = new Date(basis.uitgevoerd_op);
          volgend.setFullYear(volgend.getFullYear() + 1);
          const dagen = Math.round((volgend - Date.now()) / 86400000);
          onderhoudRegel.appendChild(document.createTextNode('Volgend onderhoud: '));
          onderhoudRegel.appendChild(maak('strong', volgend.toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' })));
          onderhoudRegel.appendChild(document.createTextNode(dagen < 0 ? ' · te laat' : ' · over ' + dagen + ' dagen'));
          if (dagen <= 30) onderhoudRegel.classList.add('matig');
        }

        histLijst.innerHTML = '';
        if (lijst.length === 0) { histLijst.appendChild(maak('p', 'Nog geen onderhoud geregistreerd.', 'adres')); return; }
        const ul = maak('ul');
        for (const o of lijst) {
          const li = maak('li');
          li.appendChild(maak('span', new Date(o.uitgevoerd_op).toLocaleDateString('nl-BE')));
          li.appendChild(maak('strong', ONDERHOUD_TEKST[o.soort] || o.soort));
          if (o.omschrijving) li.appendChild(maak('span', o.omschrijving));
          ul.appendChild(li);
        }
        histLijst.appendChild(ul);
      }

      luister(t.id, (nieuw) => {
        if (nieuw.filter_procent !== undefined && nieuw.filter_procent !== pct) { pct = nieuw.filter_procent; tekenFilter(); laadHistoriek(); }
        if (nieuw.online !== undefined) { online = nieuw.online; tekenFilter(); }
      });

      tekenFilter();
      laadHistoriek();
      return blok;
    }

    // ---------- Beheerder: filters bijna op ----------
    async function laadFilterLijst() {
      const doel = $('filterLijst');
      if (!doel) return;
      const { data, error } = await db.from('toestel_status')
        .select('filter_procent, online, toestellen(naam, serienummer, woningen(naam, profielen(naam)))')
        .lte('filter_procent', 35)
        .order('filter_procent');
      doel.innerHTML = '';
      if (error) { doel.appendChild(maak('p', 'Fout: ' + error.message, 'fout')); return; }
      if (!data || data.length === 0) { doel.appendChild(maak('p', 'Alle filters zijn in orde.', 'adres')); return; }
      const tabel = maak('table');
      const kop = maak('tr');
      ['Filter', 'Klant', 'Woning', 'Kamer', 'Serienummer'].forEach(x => kop.appendChild(maak('th', x)));
      tabel.appendChild(kop);
      for (const r of data) {
        const t = r.toestellen || {};
        const rij = maak('tr');
        const c = maak('td');
        const o = filterOordeel(r.filter_procent);
        c.appendChild(maak('span', r.filter_procent + ' %', 'badge ' + (o[0] === 'slecht' ? 'open' : 'behandeling')));
        rij.appendChild(c);
        rij.appendChild(maak('td', t.woningen?.profielen?.naam || '—'));
        rij.appendChild(maak('td', t.woningen?.naam || '?'));
        rij.appendChild(maak('td', t.naam || '?'));
        rij.appendChild(maak('td', t.serienummer || ''));
        tabel.appendChild(rij);
      }
      doel.appendChild(tabel);
    }

    function vulChips(chips, st) {
      chips.innerHTML = '';
      chips.appendChild(maak('span', st.online ? 'Online' : 'Offline · ' + sindsTekst(st.laatst_gezien), 'chip ' + (st.online ? 'online' : 'offline')));
      if (!st.aan) chips.appendChild(maak('span', 'Uit', 'chip uit'));
      else {
        chips.appendChild(maak('span', MODUS_TEKST[st.modus] || st.modus, 'chip'));
        chips.appendChild(maak('span', 'Stand ' + st.stand, 'chip'));
      }
    }

    function startStatusRealtime() {
      if (statusKanaal) return;
      statusKanaal = db.channel('toestel-status')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'toestel_status' }, (payload) => {
          for (const fn of (luisteraars[payload.new.toestel_id] || [])) fn(payload.new);
        })
        .subscribe();
    }

    const ACTIE_TEKST = {
      aan: () => 'Aangezet', uit: () => 'Uitgezet',
      stand: (w) => 'Stand ' + w, modus: (w) => 'Modus ' + (MODUS_TEKST[w] || w),
      boost: (w) => 'Boost ' + (w || 30) + ' min', filter_reset: () => 'Filter vervangen'
    };

    // ---------- Bediening van één toestel ----------
    function bedieningBlok(t, st, chips) {
      const blok = maak('div', null, 'bediening');
      const inhoud = maak('div');
      const melding = maak('p', null, 'bed-melding');
      const log = maak('details', null, 'log');
      const logLijst = maak('div');
      log.appendChild(maak('summary', 'Laatste acties'));
      log.appendChild(logLijst);
      log.addEventListener('toggle', () => { if (log.open) laadLog(); });
      blok.append(inhoud, melding, log);

      let huidig = st;
      let bezig = false;

      async function stuur(actie, waarde) {
        if (bezig) return;
        bezig = true; teken(huidig);
        melding.textContent = 'Bezig met versturen...'; melding.className = 'bed-melding';

        const { data, error } = await db.from('commandos')
          .insert({ toestel_id: t.id, actie, waarde: waarde ?? null })
          .select('status, foutmelding')
          .single();

        if (error) {
          melding.textContent = 'Niet gelukt: ' + error.message; melding.className = 'bed-melding fout';
        } else if (data.status === 'mislukt') {
          melding.textContent = 'Niet uitgevoerd: ' + (data.foutmelding || 'onbekende fout'); melding.className = 'bed-melding fout';
        } else if (data.status === 'wachtend') {
          melding.textContent = 'Verstuurd — wacht op bevestiging van het toestel...'; melding.className = 'bed-melding';
        } else {
          melding.textContent = 'Uitgevoerd ✓ (' + ACTIE_TEKST[actie](waarde) + ')'; melding.className = 'bed-melding ok';
        }

        // Toestand opnieuw ophalen: we tonen wat het toestel bevestigt, niet wat we vroegen
        const { data: nieuw } = await db.from('toestel_status').select('*').eq('toestel_id', t.id).single();
        bezig = false;
        teken(nieuw || huidig);
        if (log.open) laadLog();
      }

      function segment(opties, actief, bijKlik, extraKlasse) {
        const seg = maak('div', null, 'seg' + (extraKlasse ? ' ' + extraKlasse : ''));
        for (const [waarde, tekst] of opties) {
          const b = maak('button', tekst, waarde === actief ? 'actief' : '');
          b.type = 'button';
          b.disabled = bezig || !huidig.online;
          b.addEventListener('click', () => { if (waarde !== actief) bijKlik(waarde); });
          seg.appendChild(b);
        }
        return seg;
      }

      function rij(label, ...inhoudDelen) {
        const r = maak('div', null, 'bed-rij');
        r.appendChild(maak('span', label, 'bed-label'));
        for (const d of inhoudDelen) r.appendChild(d);
        return r;
      }

      function teken(s) {
        huidig = s;
        vulChips(chips, s);
        inhoud.innerHTML = '';

        if (!s.online) inhoud.appendChild(maak('p', 'Toestel is offline — bediening niet mogelijk tot het weer verbinding heeft.', 'bed-offline'));

        // Aan / uit
        inhoud.appendChild(rij('Toestel',
          segment([['aan', 'Aan'], ['uit', 'Uit']], s.aan ? 'aan' : 'uit', (w) => stuur(w))));

        if (s.aan) {
          // Modus
          const modusSeg = segment(
            [['automatisch', 'Automatisch'], ['handmatig', 'Handmatig'], ['sleep', 'Sleep Air'], ['afwezig', 'Afwezig']],
            s.modus, (w) => stuur('modus', w));
          inhoud.appendChild(rij('Modus', modusSeg));

          // Stand
          const standSeg = segment([1, 2, 3, 4, 5].map(n => [n, String(n)]), s.stand, (n) => stuur('stand', String(n)), 'stand');
          const standRij = rij('Stand', standSeg);
          if (s.modus === 'automatisch') standRij.appendChild(maak('span', 'Automatisch geregeld — kies een stand om over te nemen', 'adres'));
          inhoud.appendChild(standRij);

          // Boost
          if (s.modus === 'boost' && s.boost_tot) {
            const tot = new Date(s.boost_tot).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
            const stop = maak('button', 'Boost stoppen', 'licht');
            stop.disabled = bezig || !s.online;
            stop.addEventListener('click', () => stuur('modus', s.voor_boost_modus && s.voor_boost_modus !== 'boost' ? s.voor_boost_modus : 'automatisch'));
            inhoud.appendChild(rij('Boost', maak('span', 'Actief op maximum tot ' + tot, 'bed-info'), stop));
          } else {
            const duur = maak('select');
            for (const m of [15, 30, 60]) { const o = maak('option', m + ' min'); o.value = m; duur.appendChild(o); }
            duur.value = '30';
            duur.disabled = bezig || !s.online;
            const start = maak('button', 'Boost starten', 'licht');
            start.disabled = bezig || !s.online;
            start.addEventListener('click', () => stuur('boost', duur.value));
            inhoud.appendChild(rij('Boost', duur, start));
          }
        }
      }

      async function laadLog() {
        const { data } = await db.from('commandos')
          .select('actie, waarde, status, foutmelding, aangemaakt_op, profielen(naam)')
          .eq('toestel_id', t.id)
          .order('aangemaakt_op', { ascending: false })
          .limit(8);
        logLijst.innerHTML = '';
        if (!data || data.length === 0) { logLijst.appendChild(maak('p', 'Nog geen acties.', 'adres')); return; }
        const ul = maak('ul');
        for (const c of data) {
          const li = maak('li');
          li.appendChild(maak('span', c.status === 'uitgevoerd' ? 'OK' : c.status, 'badge ' + (c.status === 'uitgevoerd' ? 'opgelost' : c.status === 'mislukt' ? 'open' : 'behandeling')));
          li.appendChild(maak('span', datum(c.aangemaakt_op)));
          li.appendChild(maak('strong', (ACTIE_TEKST[c.actie] || (() => c.actie))(c.waarde)));
          li.appendChild(maak('span', 'door ' + (c.profielen?.naam || 'Vernast')));
          if (c.foutmelding) li.appendChild(maak('span', c.foutmelding, 'fout'));
          ul.appendChild(li);
        }
        logLijst.appendChild(ul);
      }

      luister(t.id, (nieuw) => { if (!bezig) teken({ ...huidig, ...nieuw }); });
      teken(st);
      return blok;
    }

    function tegel(label, waarde, eenheid, oordeel) {
      const t = maak('div', null, 'tegel');
      t.appendChild(maak('div', label, 'label'));
      const w = maak('div', null, 'waarde');
      w.appendChild(document.createTextNode(waarde));
      if (waarde !== '–') w.appendChild(maak('span', eenheid, 'eenheid'));
      t.appendChild(w);
      if (oordeel) t.appendChild(maak('div', oordeel[1], 'status ' + oordeel[0]));
      return t;
    }

    // ---------- Grafiek met keuze meetwaarde + periode ----------
    function grafiekBlok(toestelId) {
      const blok = maak('div', null, 'grafiek');
      const balk = maak('div', null, 'grafiek-balk');
      const tabsW = maak('div', null, 'tabs');
      const tabsP = maak('div', null, 'tabs periode');
      const vak = maak('div', null, 'grafiek-vak');
      balk.append(tabsW, tabsP);
      blok.append(balk, vak);

      let keuze = 'co2';
      let periode = '24u';
      let cache = {};

      async function laad() {
        vak.innerHTML = '';
        vak.appendChild(maak('div', 'Grafiek laden...', 'grafiek-leeg'));
        if (!cache[periode]) {
          const { data, error } = await db.rpc('metingen_reeks', { p_toestel: toestelId, p_periode: periode });
          if (error) { vak.innerHTML = ''; vak.appendChild(maak('div', 'Fout: ' + error.message, 'grafiek-leeg')); return; }
          cache[periode] = data || [];
        }
        tekenGrafiek(vak, cache[periode], keuze, periode);
      }

      function maakTabs(houder, opties, huidig, bijKlik) {
        houder.innerHTML = '';
        for (const [waarde, tekst] of opties) {
          const b = maak('button', tekst, waarde === huidig ? 'actief' : '');
          b.type = 'button';
          b.addEventListener('click', () => { bijKlik(waarde); });
          houder.appendChild(b);
        }
      }
      function herteken() {
        maakTabs(tabsW, Object.entries(MEETWAARDEN).map(([k, c]) => [k, c.label]), keuze, (k) => { keuze = k; herteken(); laad(); });
        maakTabs(tabsP, [['24u', '24 u'], ['7d', '7 d'], ['30d', '30 d']], periode, (p) => { periode = p; herteken(); laad(); });
      }
      herteken();
      laad();
      return blok;
    }

    function tekenGrafiek(vak, punten, sleutel, periode) {
      vak.innerHTML = '';
      const cfg = MEETWAARDEN[sleutel];
      const reeks = punten.filter(p => p[sleutel] !== null && p[sleutel] !== undefined)
        .map(p => ({ t: new Date(p.tijd).getTime(), v: Number(p[sleutel]) }));
      if (reeks.length < 2) { vak.appendChild(maak('div', 'Te weinig metingen voor een grafiek.', 'grafiek-leeg')); return; }

      // Breedte volgt het scherm, zodat tekst leesbaar blijft op gsm
      const W = Math.max(320, Math.round(vak.clientWidth || 800));
      const H = W < 500 ? 220 : 240, L = 46, R = 14, T = 14, B = 26;
      vak._laatst = { punten, sleutel, periode, W };
      if (!vak._observer && window.ResizeObserver) {
        vak._observer = new ResizeObserver(() => {
          const l = vak._laatst;
          if (l && vak.clientWidth && Math.abs(vak.clientWidth - l.W) > 40) tekenGrafiek(vak, l.punten, l.sleutel, l.periode);
        });
        vak._observer.observe(vak);
      }
      const tMin = reeks[0].t, tMax = reeks[reeks.length - 1].t;
      let vMin = Math.min(...reeks.map(p => p.v)), vMax = Math.max(...reeks.map(p => p.v));
      for (const d of cfg.drempels) { if (d.w <= vMax * 1.15) vMax = Math.max(vMax, d.w); }
      const marge = (vMax - vMin) * 0.12 || 1;
      vMin = Math.max(0, vMin - marge); vMax = vMax + marge;
      const x = (t) => L + (t - tMin) / (tMax - tMin) * (W - L - R);
      const y = (v) => T + (1 - (v - vMin) / (vMax - vMin)) * (H - T - B);

      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      const el = (tag, attrs, tekst) => {
        const e = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (tekst !== undefined) e.textContent = tekst;
        svg.appendChild(e); return e;
      };

      // verloop onder de lijn
      const defs = document.createElementNS(ns, 'defs');
      const id = 'verloop' + Math.random().toString(36).slice(2);
      defs.innerHTML = `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>`;
      svg.appendChild(defs);

      // horizontale rasterlijnen + y-as
      for (let i = 0; i <= 4; i++) {
        const v = vMin + (vMax - vMin) * i / 4;
        el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: '#1D1D1B' });
        el('text', { x: L - 8, y: y(v) + 3, 'text-anchor': 'end', class: 'as' }, getal(v, cfg.dec > 0 ? cfg.dec : 0));
      }

      // x-as labels
      for (let i = 0; i <= 4; i++) {
        const t = tMin + (tMax - tMin) * i / 4;
        const d = new Date(t);
        const tekst = periode === '24u'
          ? d.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' })
          : d.toLocaleDateString('nl-BE', { day: '2-digit', month: '2-digit' });
        el('text', { x: x(t), y: H - 6, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle', class: 'as' }, tekst);
      }

      // drempels
      for (const d of cfg.drempels) {
        if (d.w < vMin || d.w > vMax) continue;
        el('line', { x1: L, x2: W - R, y1: y(d.w), y2: y(d.w), stroke: KLEUR[d.k], 'stroke-opacity': 0.55, 'stroke-dasharray': '4 4' });
        el('text', { x: W - R - 2, y: y(d.w) - 4, 'text-anchor': 'end', class: 'drempel-label', fill: KLEUR[d.k] }, getal(d.w, cfg.dec) + ' ' + cfg.eenheid);
      }

      // lijn + vlak
      const pad = reeks.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
      el('path', { d: pad + ` L ${x(tMax).toFixed(1)} ${H - B} L ${x(tMin).toFixed(1)} ${H - B} Z`, fill: `url(#${id})` });
      el('path', { d: pad, fill: 'none', stroke: '#22D3EE', 'stroke-width': 2, 'stroke-linejoin': 'round' });

      // hover: verticale lijn + punt + tooltip
      const hl = el('line', { y1: T, y2: H - B, stroke: '#3A3A37', visibility: 'hidden' });
      const pt = el('circle', { r: 4, fill: '#22D3EE', stroke: '#0B0B0A', 'stroke-width': 2, visibility: 'hidden' });
      const tip = maak('div', null, 'tip verborgen');
      const vang = el('rect', { x: L, y: T, width: W - L - R, height: H - T - B, fill: 'transparent' });
      vak.append(svg, tip);

      function toon(evt) {
        const r = svg.getBoundingClientRect();
        const bron = evt.touches ? evt.touches[0] : evt;
        const sx = (bron.clientX - r.left) / r.width * W;
        const tWaarde = tMin + (sx - L) / (W - L - R) * (tMax - tMin);
        let best = reeks[0];
        for (const p of reeks) if (Math.abs(p.t - tWaarde) < Math.abs(best.t - tWaarde)) best = p;
        const px = x(best.t), py = y(best.v);
        hl.setAttribute('x1', px); hl.setAttribute('x2', px); hl.setAttribute('visibility', 'visible');
        pt.setAttribute('cx', px); pt.setAttribute('cy', py); pt.setAttribute('visibility', 'visible');
        tip.innerHTML = '';
        tip.appendChild(document.createTextNode(getal(best.v, cfg.dec) + ' ' + cfg.eenheid));
        tip.appendChild(maak('small', new Date(best.t).toLocaleString('nl-BE', { dateStyle: 'short', timeStyle: 'short' })));
        tip.style.left = (px / W * r.width) + 'px';
        tip.style.top = (py / H * r.height) + 'px';
        tip.classList.remove('verborgen');
      }
      function verberg() { hl.setAttribute('visibility', 'hidden'); pt.setAttribute('visibility', 'hidden'); tip.classList.add('verborgen'); }
      vang.addEventListener('mousemove', toon);
      vang.addEventListener('touchstart', toon, { passive: true });
      vang.addEventListener('touchmove', toon, { passive: true });
      vang.addEventListener('mouseleave', verberg);
      vang.addEventListener('touchend', verberg);
    }

    // ---------- Klant: hulpknop ----------
    function hulpBlok(w) {
      const blok = maak('div', null, 'hulp');
      blok.appendChild(maak('h3', 'Hulp nodig?'));

      const tekst = maak('textarea');
      tekst.placeholder = 'Beschrijf kort het probleem (optioneel)';
      tekst.maxLength = 500;

      const knop = maak('button', 'Hulp vragen', 'hulpknop');
      const status = maak('p');
      const eigenLijst = maak('div', null, 'eigen-meldingen');

      knop.addEventListener('click', async () => {
        knop.disabled = true;
        status.textContent = 'Bezig met versturen...';
        status.className = '';
        const { error } = await db.from('meldingen').insert({
          woning_id: w.id,
          bericht: tekst.value.trim() || null
        });
        if (error) {
          status.textContent = 'Versturen mislukt: ' + error.message;
          status.className = 'fout';
        } else {
          status.textContent = 'Uw melding is verstuurd. Vernast neemt zo snel mogelijk contact met u op.';
          status.className = 'ok';
          tekst.value = '';
          await laadEigenMeldingen(w.id, eigenLijst);
        }
        knop.disabled = false;
      });

      blok.append(tekst, knop, status, eigenLijst);
      laadEigenMeldingen(w.id, eigenLijst);
      return blok;
    }

    async function laadEigenMeldingen(woningId, doel) {
      const { data } = await db.from('meldingen')
        .select('bericht, status, aangemaakt_op')
        .eq('woning_id', woningId)
        .order('aangemaakt_op', { ascending: false })
        .limit(5);
      doel.innerHTML = '';
      if (!data || data.length === 0) return;
      doel.appendChild(maak('h3', 'Uw laatste meldingen'));
      const ul = maak('ul');
      for (const m of data) {
        const li = maak('li');
        li.appendChild(statusBadge(m.status));
        li.appendChild(maak('span', datum(m.aangemaakt_op), 'adres'));
        if (m.bericht) li.appendChild(maak('span', m.bericht));
        ul.appendChild(li);
      }
      doel.appendChild(ul);
    }

    // ---------- Beheerder: meldingenoverzicht ----------
    async function laadMeldingen() {
      const doel = $('meldingenLijst');
      $('meldingenFout').textContent = '';

      const { data, error } = await db.from('meldingen')
        .select('id, bericht, status, aangemaakt_op, woningen(naam, adres), profielen(naam)')
        .order('aangemaakt_op', { ascending: false });

      doel.innerHTML = '';
      if (error) { $('meldingenFout').textContent = 'Fout: ' + error.message; return; }

      $('aantalOpen').textContent = data.filter(m => m.status !== 'opgelost').length;
      if (data.length === 0) { doel.appendChild(maak('p', 'Nog geen meldingen.', 'adres')); return; }

      const tabel = maak('table');
      const kop = maak('tr');
      ['Tijdstip', 'Woning', 'Klant', 'Bericht', 'Status', 'Actie'].forEach(t => kop.appendChild(maak('th', t)));
      tabel.appendChild(kop);

      for (const m of data) {
        const rij = maak('tr');
        if (m.status === 'open') rij.className = 'open-rij';
        rij.appendChild(maak('td', datum(m.aangemaakt_op)));
        rij.appendChild(maak('td', (m.woningen?.naam || '?') + (m.woningen?.adres ? ' – ' + m.woningen.adres : '')));
        rij.appendChild(maak('td', m.profielen?.naam || '?'));
        rij.appendChild(maak('td', m.bericht || '(geen beschrijving)'));
        const st = maak('td'); st.appendChild(statusBadge(m.status)); rij.appendChild(st);

        const actie = maak('td', null, 'acties');
        if (m.status === 'open') {
          const b = maak('button', 'In behandeling', 'licht');
          b.addEventListener('click', () => zetStatus(m.id, 'in behandeling'));
          actie.appendChild(b);
        }
        if (m.status !== 'opgelost') {
          const b = maak('button', 'Opgelost');
          b.addEventListener('click', () => zetStatus(m.id, 'opgelost'));
          actie.appendChild(b);
        }
        rij.appendChild(actie);
        tabel.appendChild(rij);
      }
      doel.appendChild(tabel);
    }

    async function zetStatus(id, status) {
      const { error } = await db.from('meldingen').update({ status }).eq('id', id);
      if (error) { $('meldingenFout').textContent = 'Status wijzigen mislukt: ' + error.message; return; }
      await laadMeldingen();
    }

    function startRealtime() {
      if (kanaal) return;
      kanaal = db.channel('meldingen-beheer')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'meldingen' }, (payload) => {
          if (payload.eventType === 'INSERT') {
            const banner = $('nieuwBanner');
            banner.classList.remove('verborgen');
            setTimeout(() => banner.classList.add('verborgen'), 10000);
          }
          laadMeldingen();
        })
        .subscribe();
    }

    // ---------- Beheerder: klanten en woningen ----------
    async function laadKlanten() {
      const { data, error } = await db.from('profielen')
        .select('id, naam, email').eq('rol', 'klant').order('naam');
      const doel = $('klantenLijst');
      doel.innerHTML = '';
      if (error) { doel.appendChild(maak('p', 'Fout: ' + error.message, 'fout')); return; }
      klanten = data || [];
      vulKlantKeuze($('nwKlant'), null);

      if (klanten.length === 0) { doel.appendChild(maak('p', 'Nog geen klanten.', 'adres')); return; }
      const tabel = maak('table');
      const kop = maak('tr');
      ['Naam', 'E-mail'].forEach(t => kop.appendChild(maak('th', t)));
      tabel.appendChild(kop);
      for (const k of klanten) {
        const rij = maak('tr');
        rij.appendChild(maak('td', k.naam || '(geen naam)'));
        rij.appendChild(maak('td', k.email || ''));
        tabel.appendChild(rij);
      }
      doel.appendChild(tabel);
    }

    function vulKlantKeuze(select, gekozen) {
      select.innerHTML = '';
      const leeg = maak('option', '— geen klant —'); leeg.value = '';
      select.appendChild(leeg);
      for (const k of klanten) {
        const o = maak('option', (k.naam || '(geen naam)') + ' (' + (k.email || '') + ')');
        o.value = k.id;
        select.appendChild(o);
      }
      select.value = gekozen || '';
    }

    function klantKeuzeVoorWoning(w) {
      const blok = maak('div', null, 'klantkeuze');
      blok.appendChild(maak('span', 'Klant'));
      const select = maak('select');
      vulKlantKeuze(select, w.klant_id);
      const status = maak('span');
      select.addEventListener('change', async () => {
        status.textContent = 'Bezig...'; status.className = '';
        const { error } = await db.from('woningen')
          .update({ klant_id: select.value || null }).eq('id', w.id);
        if (error) { status.textContent = 'Mislukt: ' + error.message; status.className = 'fout'; }
        else { status.textContent = 'Opgeslagen ✓'; status.className = 'ok'; }
      });
      blok.append(select, status);
      return blok;
    }

    function genereerWachtwoord() {
      const tekens = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      const r = new Uint32Array(12);
      crypto.getRandomValues(r);
      $('nkWachtwoord').value = Array.from(r, n => tekens[n % tekens.length]).join('');
    }

    async function klantAanmaken() {
      const st = $('nkStatus');
      const naam = $('nkNaam').value.trim();
      const email = $('nkEmail').value.trim();
      const wachtwoord = $('nkWachtwoord').value;
      if (!naam || !email || wachtwoord.length < 8) {
        st.textContent = 'Vul naam, e-mail en een wachtwoord van minstens 8 tekens in.';
        st.className = 'fout'; return;
      }
      $('nkKnop').disabled = true;
      st.textContent = 'Bezig...'; st.className = '';

      const { error } = await db.functions.invoke(FUNCTIE_KLANT_AANMAKEN, {
        body: { naam, email, wachtwoord }
      });

      if (error) {
        let melding = error.message;
        try { const b = await error.context.json(); if (b && b.fout) melding = b.fout; } catch (e) {}
        st.textContent = 'Mislukt: ' + melding; st.className = 'fout';
      } else {
        st.textContent = 'Klant aangemaakt: ' + email + '. Geef de klant het tijdelijke wachtwoord door.';
        st.className = 'ok';
        $('nkNaam').value = ''; $('nkEmail').value = '';
        await laadKlanten();
        await toonWoningen();
      }
      $('nkKnop').disabled = false;
    }

    async function woningAanmaken() {
      const st = $('nwStatus');
      const naam = $('nwNaam').value.trim();
      if (!naam) { st.textContent = 'Vul een naam in.'; st.className = 'fout'; return; }
      $('nwKnop').disabled = true;
      const { error } = await db.from('woningen').insert({
        naam,
        adres: $('nwAdres').value.trim() || null,
        klant_id: $('nwKlant').value || null
      });
      if (error) { st.textContent = 'Mislukt: ' + error.message; st.className = 'fout'; }
      else {
        st.textContent = 'Woning aangemaakt: ' + naam; st.className = 'ok';
        $('nwNaam').value = ''; $('nwAdres').value = ''; $('nwKlant').value = '';
        await toonWoningen();
      }
      $('nwKnop').disabled = false;
    }

    // ---------- Knoppen koppelen ----------
    $('nkGenereer').addEventListener('click', genereerWachtwoord);
    $('nkKnop').addEventListener('click', klantAanmaken);
    $('nwKnop').addEventListener('click', woningAanmaken);
    $('loginKnop').addEventListener('click', inloggen);
    $('wachtwoord').addEventListener('keydown', (e) => { if (e.key === 'Enter') inloggen(); });
    $('uitlogKnop').addEventListener('click', uitloggen);

    // Al ingelogd? Dan meteen de app tonen.
    db.auth.getSession().then(({ data }) => { if (data.session) toonApp(); });
  </script>
</body>
</html>
