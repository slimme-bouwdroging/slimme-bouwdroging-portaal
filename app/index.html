<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0A">
  <title>Fresh Air One – Klantenportaal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ===================== INLOGGEN ===================== -->
  <div id="loginBlok" class="login-wrap verborgen">
    <div class="kaart login">
      <p class="eyebrow">Vernast-app</p>
      <h1>Welkom terug.</h1>
      <p class="ondertitel">Log in om de lucht in uw woning op te volgen.</p>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username">
      <label for="wachtwoord">Wachtwoord</label>
      <input id="wachtwoord" type="password" autocomplete="current-password">
      <button id="loginKnop">Inloggen</button>
      <p id="loginFout" class="fout"></p>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="shell" class="shell verborgen">

    <!-- Menu links (computer) -->
    <aside class="zijbalk">
      <div class="merk"><strong>Fresh Air One</strong><span>Klantenportaal</span></div>
      <nav id="nav" class="nav"></nav>
      <div class="zijbalk-voet">
        <div>
          <div id="wieNaam" class="wie"></div>
          <span id="wieRol" class="rolbadge"></span>
        </div>
        <button id="uitlogKnop" class="licht">Uitloggen</button>
      </div>
    </aside>

    <div class="inhoud">
      <!-- Kopbalk (gsm) -->
      <div class="mobiele-kop">
        <strong>Fresh Air One</strong>
        <button id="uitlogKnopMobiel" class="licht">Uitloggen</button>
      </div>

      <div id="tijdelijkBanner" class="banner-wrap verborgen">
        <div class="info-banner">
          <span>U gebruikt nog een tijdelijk wachtwoord. Kies een eigen wachtwoord.</span>
          <a href="#/account"><button type="button">Nu wijzigen</button></a>
        </div>
      </div>

      <main id="pagina" class="pagina"></main>
    </div>

    <!-- Tabbalk onderaan (gsm) -->
    <nav id="tabbalk" class="tabbalk"></nav>
  </div>

  <div id="toasts" class="toasts"></div>

  <!-- Instellingen eerst, daarna de app (als module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
