<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slimme BouwDroging – klantenportaal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { color: #1b5e7a; }
    .kaart { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    input, textarea { display: block; width: 100%; max-width: 420px; padding: 8px; margin: 6px 0 12px; box-sizing: border-box; }
    textarea { min-height: 60px; }
    button { padding: 8px 16px; cursor: pointer; margin-right: 6px; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border-bottom: 1px solid #eee; padding: 6px; text-align: left; vertical-align: top; }
    .fout { color: #b00020; }
    .ok { color: #1b7a3a; }
    .verborgen { display: none; }
    .hulp { border-top: 1px solid #eee; margin-top: 16px; padding-top: 12px; }
    .hulpknop { background: #c62828; color: #fff; border: none; border-radius: 6px; font-weight: bold; }
    .hulpknop:disabled { opacity: 0.6; }
    tr.open { background: #fff0f0; }
    .banner { background: #c62828; color: #fff; padding: 12px 16px; border-radius: 8px; font-weight: bold; }
    .beheer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .beheer-grid .kaart { margin: 0; }
    select { padding: 6px; margin: 6px 0 12px; max-width: 420px; width: 100%; }
    .rij { display: flex; gap: 6px; align-items: center; max-width: 420px; }
    .rij input { margin: 0; }
    .klantkeuze { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .klantkeuze select { width: auto; margin: 0; }
  </style>
</head>
<body>
  <h1>Slimme BouwDroging</h1>

  <!-- Inloggen -->
  <div id="loginBlok" class="kaart">
    <h2>Inloggen</h2>
    <label>E-mail <input id="email" type="email" autocomplete="username"></label>
    <label>Wachtwoord <input id="wachtwoord" type="password" autocomplete="current-password"></label>
    <button id="loginKnop">Inloggen</button>
    <p id="loginFout" class="fout"></p>
  </div>

  <!-- Na inloggen -->
  <div id="appBlok" class="verborgen">
    <p>Ingelogd als <strong id="naam"></strong> (rol: <span id="rol"></span>)
      <button id="uitlogKnop">Uitloggen</button></p>

    <!-- Alleen voor beheerder (Vernast) -->
    <div id="meldingenBlok" class="kaart verborgen">
      <div id="nieuwBanner" class="banner verborgen">🔔 Nieuwe melding!</div>
      <h2>Meldingen (<span id="aantalOpen">0</span> open)</h2>
      <p id="meldingenFout" class="fout"></p>
      <div id="meldingenLijst"></div>
    </div>

    <!-- Alleen voor beheerder: klanten en woningen beheren -->
    <div id="beheerBlok" class="verborgen">
      <h2>Beheer</h2>
      <div class="beheer-grid">
        <div class="kaart">
          <h3>Klant toevoegen</h3>
          <label>Naam <input id="nkNaam" type="text"></label>
          <label>E-mail <input id="nkEmail" type="email"></label>
          <label>Tijdelijk wachtwoord (min. 8 tekens)</label>
          <div class="rij">
            <input id="nkWachtwoord" type="text" autocomplete="off">
            <button id="nkGenereer" type="button">Genereer</button>
          </div>
          <p></p>
          <button id="nkKnop">Klant aanmaken</button>
          <p id="nkStatus"></p>
        </div>
        <div class="kaart">
          <h3>Woning toevoegen</h3>
          <label>Naam <input id="nwNaam" type="text" placeholder="Woning 003"></label>
          <label>Adres <input id="nwAdres" type="text"></label>
          <label>Klant <select id="nwKlant"></select></label>
          <button id="nwKnop">Woning aanmaken</button>
          <p id="nwStatus"></p>
        </div>
      </div>
      <div class="kaart">
        <h3>Klanten</h3>
        <div id="klantenLijst"></div>
      </div>
      <h2>Woningen</h2>
    </div>

    <div id="woningen"></div>
  </div>

  <script>
    // Alleen de PUBLIEKE sleutel hier. Nooit de secret/service_role key!
    const SUPABASE_URL = 'https://tmkolufszuzbariaupsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_HZgBbFIujygWgu7LCe7PSg_MPnblGz2';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let rol = null;
    let kanaal = null;
    let klanten = [];

    const $ = (id) => document.getElementById(id);
    const datum = (t) => new Date(t).toLocaleString('nl-BE');

    function maak(tag, tekst) {
      const el = document.createElement(tag);
      if (tekst !== undefined) el.textContent = tekst;
      return el;
    }

    // ---------- Inloggen / uitloggen ----------
    async function inloggen() {
      $('loginFout').textContent = '';
      const { error } = await db.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('wachtwoord').value
      });
      if (error) { $('loginFout').textContent = 'Inloggen mislukt: ' + error.message; return; }
      await toonApp();
    }

    async function uitloggen() {
      if (kanaal) { await db.removeChannel(kanaal); kanaal = null; }
      await db.auth.signOut();
      rol = null;
      $('appBlok').classList.add('verborgen');
      $('meldingenBlok').classList.add('verborgen');
      $('beheerBlok').classList.add('verborgen');
      $('loginBlok').classList.remove('verborgen');
    }

    // ---------- Hoofdscherm ----------
    async function toonApp() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) return;

      const { data: profiel } = await db.from('profielen')
        .select('naam, rol').eq('id', user.id).single();
      rol = profiel?.rol || 'onbekend';
      $('naam').textContent = profiel?.naam || user.email;
      $('rol').textContent = rol;

      if (rol === 'beheerder') {
        $('meldingenBlok').classList.remove('verborgen');
        $('beheerBlok').classList.remove('verborgen');
        await laadMeldingen();
        await laadKlanten();
        startRealtime();
      } else {
        $('meldingenBlok').classList.add('verborgen');
        $('beheerBlok').classList.add('verborgen');
      }

      await toonWoningen();

      $('loginBlok').classList.add('verborgen');
      $('appBlok').classList.remove('verborgen');
    }

    async function toonWoningen() {
      const lijst = $('woningen');
      lijst.innerHTML = '';

      const { data: woningen, error } = await db.from('woningen')
        .select('id, naam, adres, klant_id').order('naam');
      if (error) { lijst.appendChild(maak('p', 'Fout: ' + error.message)); return; }
      if (woningen.length === 0) { lijst.appendChild(maak('p', 'Geen woningen gevonden.')); }

      for (const w of woningen) {
        const kaart = maak('div'); kaart.className = 'kaart';
        kaart.appendChild(maak('h2', w.naam));
        kaart.appendChild(maak('p', w.adres || ''));
        if (rol === 'beheerder') kaart.appendChild(klantKeuzeVoorWoning(w));
        kaart.appendChild(await metingenTabel(w.id));
        if (rol === 'klant') kaart.appendChild(hulpBlok(w));
        lijst.appendChild(kaart);
      }
    }

    async function metingenTabel(woningId) {
      const { data: metingen } = await db.from('metingen')
        .select('gemeten_op, temperatuur, vochtigheid, co2')
        .eq('woning_id', woningId)
        .order('gemeten_op', { ascending: false })
        .limit(10);

      if (!metingen || metingen.length === 0) return maak('p', 'Nog geen metingen.');

      const tabel = maak('table');
      const kop = maak('tr');
      ['Tijdstip', 'Temperatuur (°C)', 'Vochtigheid (%)', 'CO₂ (ppm)']
        .forEach(t => kop.appendChild(maak('th', t)));
      tabel.appendChild(kop);
      for (const m of metingen) {
        const rij = maak('tr');
        rij.appendChild(maak('td', datum(m.gemeten_op)));
        rij.appendChild(maak('td', m.temperatuur ?? '–'));
        rij.appendChild(maak('td', m.vochtigheid ?? '–'));
        rij.appendChild(maak('td', m.co2 ?? '–'));
        tabel.appendChild(rij);
      }
      return tabel;
    }

    // ---------- Klant: hulpknop ----------
    function hulpBlok(w) {
      const blok = maak('div'); blok.className = 'hulp';
      blok.appendChild(maak('h3', 'Hulp nodig?'));

      const tekst = maak('textarea');
      tekst.placeholder = 'Beschrijf kort het probleem (optioneel)';
      tekst.maxLength = 500;

      const knop = maak('button', '🆘 Hulp vragen');
      knop.className = 'hulpknop';

      const status = maak('p');
      const eigenLijst = maak('div');

      knop.addEventListener('click', async () => {
        knop.disabled = true;
        status.textContent = 'Bezig met versturen...';
        status.className = '';
        const { error } = await db.from('meldingen').insert({
          woning_id: w.id,
          bericht: tekst.value.trim() || null
        });
        if (error) {
          status.textContent = 'Versturen mislukt: ' + error.message;
          status.className = 'fout';
        } else {
          status.textContent = 'Uw melding is verstuurd. Vernast neemt zo snel mogelijk contact met u op.';
          status.className = 'ok';
          tekst.value = '';
          await laadEigenMeldingen(w.id, eigenLijst);
        }
        knop.disabled = false;
      });

      blok.append(tekst, knop, status, eigenLijst);
      laadEigenMeldingen(w.id, eigenLijst);
      return blok;
    }

    async function laadEigenMeldingen(woningId, doel) {
      const { data } = await db.from('meldingen')
        .select('bericht, status, aangemaakt_op')
        .eq('woning_id', woningId)
        .order('aangemaakt_op', { ascending: false })
        .limit(5);
      doel.innerHTML = '';
      if (!data || data.length === 0) return;
      doel.appendChild(maak('h4', 'Uw laatste meldingen'));
      const ul = maak('ul');
      for (const m of data) {
        ul.appendChild(maak('li',
          datum(m.aangemaakt_op) + ' – ' + m.status + (m.bericht ? ' – ' + m.bericht : '')));
      }
      doel.appendChild(ul);
    }

    // ---------- Beheerder: meldingenoverzicht ----------
    async function laadMeldingen() {
      const doel = $('meldingenLijst');
      $('meldingenFout').textContent = '';

      const { data, error } = await db.from('meldingen')
        .select('id, bericht, status, aangemaakt_op, woningen(naam, adres), profielen(naam)')
        .order('aangemaakt_op', { ascending: false });

      doel.innerHTML = '';
      if (error) { $('meldingenFout').textContent = 'Fout: ' + error.message; return; }

      $('aantalOpen').textContent = data.filter(m => m.status !== 'opgelost').length;
      if (data.length === 0) { doel.appendChild(maak('p', 'Nog geen meldingen.')); return; }

      const tabel = maak('table');
      const kop = maak('tr');
      ['Tijdstip', 'Woning', 'Klant', 'Bericht', 'Status', 'Actie']
        .forEach(t => kop.appendChild(maak('th', t)));
      tabel.appendChild(kop);

      for (const m of data) {
        const rij = maak('tr');
        if (m.status === 'open') rij.className = 'open';
        rij.appendChild(maak('td', datum(m.aangemaakt_op)));
        rij.appendChild(maak('td', (m.woningen?.naam || '?') + (m.woningen?.adres ? ' – ' + m.woningen.adres : '')));
        rij.appendChild(maak('td', m.profielen?.naam || '?'));
        rij.appendChild(maak('td', m.bericht || '(geen beschrijving)'));
        rij.appendChild(maak('td', m.status));

        const actie = maak('td');
        if (m.status === 'open') {
          const b = maak('button', 'In behandeling');
          b.addEventListener('click', () => zetStatus(m.id, 'in behandeling'));
          actie.appendChild(b);
        }
        if (m.status !== 'opgelost') {
          const b = maak('button', 'Opgelost');
          b.addEventListener('click', () => zetStatus(m.id, 'opgelost'));
          actie.appendChild(b);
        }
        rij.appendChild(actie);
        tabel.appendChild(rij);
      }
      doel.appendChild(tabel);
    }

    async function zetStatus(id, status) {
      const { error } = await db.from('meldingen').update({ status }).eq('id', id);
      if (error) { $('meldingenFout').textContent = 'Status wijzigen mislukt: ' + error.message; return; }
      await laadMeldingen();
    }

    function startRealtime() {
      if (kanaal) return;
      kanaal = db.channel('meldingen-beheer')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'meldingen' }, (payload) => {
          if (payload.eventType === 'INSERT') {
            const banner = $('nieuwBanner');
            banner.classList.remove('verborgen');
            setTimeout(() => banner.classList.add('verborgen'), 10000);
          }
          laadMeldingen();
        })
        .subscribe();
    }

    // ---------- Beheerder: klanten en woningen ----------
    async function laadKlanten() {
      const { data, error } = await db.from('profielen')
        .select('id, naam, email').eq('rol', 'klant').order('naam');
      const doel = $('klantenLijst');
      doel.innerHTML = '';
      if (error) { doel.appendChild(maak('p', 'Fout: ' + error.message)); return; }
      klanten = data || [];
      vulKlantKeuze($('nwKlant'), null);

      if (klanten.length === 0) { doel.appendChild(maak('p', 'Nog geen klanten.')); return; }
      const tabel = maak('table');
      const kop = maak('tr');
      ['Naam', 'E-mail'].forEach(t => kop.appendChild(maak('th', t)));
      tabel.appendChild(kop);
      for (const k of klanten) {
        const rij = maak('tr');
        rij.appendChild(maak('td', k.naam || '(geen naam)'));
        rij.appendChild(maak('td', k.email || ''));
        tabel.appendChild(rij);
      }
      doel.appendChild(tabel);
    }

    function vulKlantKeuze(select, gekozen) {
      select.innerHTML = '';
      const leeg = maak('option', '— geen klant —'); leeg.value = '';
      select.appendChild(leeg);
      for (const k of klanten) {
        const o = maak('option', (k.naam || '(geen naam)') + ' (' + (k.email || '') + ')');
        o.value = k.id;
        select.appendChild(o);
      }
      select.value = gekozen || '';
    }

    function klantKeuzeVoorWoning(w) {
      const blok = maak('div'); blok.className = 'klantkeuze';
      blok.appendChild(maak('span', 'Klant:'));
      const select = maak('select');
      vulKlantKeuze(select, w.klant_id);
      const status = maak('span');
      select.addEventListener('change', async () => {
        status.textContent = 'Bezig...'; status.className = '';
        const { error } = await db.from('woningen')
          .update({ klant_id: select.value || null }).eq('id', w.id);
        if (error) { status.textContent = 'Mislukt: ' + error.message; status.className = 'fout'; }
        else { status.textContent = 'Opgeslagen ✓'; status.className = 'ok'; }
      });
      blok.append(select, status);
      return blok;
    }

    function genereerWachtwoord() {
      const tekens = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      const r = new Uint32Array(12);
      crypto.getRandomValues(r);
      $('nkWachtwoord').value = Array.from(r, n => tekens[n % tekens.length]).join('');
    }

    async function klantAanmaken() {
      const st = $('nkStatus');
      const naam = $('nkNaam').value.trim();
      const email = $('nkEmail').value.trim();
      const wachtwoord = $('nkWachtwoord').value;
      if (!naam || !email || wachtwoord.length < 8) {
        st.textContent = 'Vul naam, e-mail en een wachtwoord van minstens 8 tekens in.';
        st.className = 'fout'; return;
      }
      $('nkKnop').disabled = true;
      st.textContent = 'Bezig...'; st.className = '';

      const { error } = await db.functions.invoke('klant-aanmaken', {
        body: { naam, email, wachtwoord }
      });

      if (error) {
        let melding = error.message;
        try { const b = await error.context.json(); if (b && b.fout) melding = b.fout; } catch (e) {}
        st.textContent = 'Mislukt: ' + melding; st.className = 'fout';
      } else {
        st.textContent = 'Klant aangemaakt: ' + email + '. Geef de klant het tijdelijke wachtwoord door.';
        st.className = 'ok';
        $('nkNaam').value = ''; $('nkEmail').value = '';
        await laadKlanten();
        await toonWoningen();
      }
      $('nkKnop').disabled = false;
    }

    async function woningAanmaken() {
      const st = $('nwStatus');
      const naam = $('nwNaam').value.trim();
      if (!naam) { st.textContent = 'Vul een naam in.'; st.className = 'fout'; return; }
      $('nwKnop').disabled = true;
      const { error } = await db.from('woningen').insert({
        naam,
        adres: $('nwAdres').value.trim() || null,
        klant_id: $('nwKlant').value || null
      });
      if (error) { st.textContent = 'Mislukt: ' + error.message; st.className = 'fout'; }
      else {
        st.textContent = 'Woning aangemaakt: ' + naam; st.className = 'ok';
        $('nwNaam').value = ''; $('nwAdres').value = ''; $('nwKlant').value = '';
        await toonWoningen();
      }
      $('nwKnop').disabled = false;
    }

    $('nkGenereer').addEventListener('click', genereerWachtwoord);
    $('nkKnop').addEventListener('click', klantAanmaken);
    $('nwKnop').addEventListener('click', woningAanmaken);

    $('loginKnop').addEventListener('click', inloggen);
    $('uitlogKnop').addEventListener('click', uitloggen);

    // Al ingelogd? Dan meteen de app tonen.
    db.auth.getSession().then(({ data }) => { if (data.session) toonApp(); });
  </script>
</body>
</html>
